<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSVP | Jaanu & Nru Wedding</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Jaanu & Nru</a>
      <button class="nav-toggle" aria-label="Toggle navigation">Menu</button>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="story.html">Our Story</a>
        <a href="event.html">Event Details</a>
        <a href="rsvp.html">RSVP</a>
        <a href="gallery.html">Gallery</a>
      </nav>
    </div>
  </header>

  <main class="container page-content">
    <section class="page-hero">
      <h1>RSVP</h1>
      <p>We can’t wait to celebrate with you. Please let us know if you will attend.</p>
    </section>

    <section class="rsvp-section">
      <form id="rsvpForm" class="rsvp-form">
        <label for="name">Your name</label>
        <input type="text" id="name" name="name" placeholder="Full name" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />

        <label for="guests">Number of guests</label>
        <input type="number" id="guests" name="guests" min="0" max="10" value="1" required />

        <label>Will you attend?</label>
        <div class="radio-group">
          <label><input type="radio" name="attendance" value="yes" required /> Yes</label>
          <label><input type="radio" name="attendance" value="no" /> No</label>
        </div>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" placeholder="Any notes for us"></textarea>

        <button type="submit" class="button">Send RSVP</button>
        <p id="rsvpMessage" class="form-message"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>With love, Jaanu & Nru</p>
      <p>© 2026</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
